<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Interactive simulator: magnification, penumbra, motion blur and superimposition in radiography.">
  <meta name="theme-color" content="#0A0E18">
  <title>Sharpness: five ways the shadow lies | Oliver Brage</title>
  <link rel="stylesheet" href="shadow.css">
  <link rel="stylesheet" href="../../topic.css">
</head>
<body data-topic="shadow">
<div class="wrap">
  <a class="back" id="t-back" href="../../"></a>
  <header>
    <div>
      <h1 id="t-title">Skarphed: fem måder skyggen snyder på</h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div class="toggles">
      <div class="seg" role="group" aria-label="Sprog / language">
        <button id="lang-da" aria-pressed="true">Dansk</button><button id="lang-en" aria-pressed="false">English</button>
      </div>
      <div class="seg" role="group" id="level-group">
        <button id="lvl-grund" aria-pressed="true"></button><button id="lvl-deep" aria-pressed="false"></button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Indhold"></nav>

  <div data-tab="video" hidden>
    <section class="video">
      <video id="vid" controls preload="none" playsinline></video>
      <p class="note" id="t-videonote"></p>
    </section>
  </div>

  <div data-tab="simulator">
  <div class="stage">
    <div class="box controls">
      <div id="controls" class="ctls"></div>
      <div id="taskcard" class="taskcard"></div>
    </div>
    <div class="box setup">
      <h2 id="t-setup"></h2>
      <canvas id="geo"></canvas>
      <div class="legend" id="geo-legend"></div>
      <p class="note" id="t-scale"></p>
    </div>
    <div class="right">
      <div class="box">
        <h2 id="t-image"></h2>
        <canvas id="img"></canvas>
        <p class="note" id="t-truth"></p>
        <p class="note" id="t-oval"></p>
        <h2 id="t-loupe" class="mt"></h2>
        <canvas id="loupe"></canvas>
      </div>
      <div class="box readout">
        <div class="metric mag"><div class="k" id="k-m"></div><div class="v" id="v-m"></div><div class="f" id="f-m"></div><div class="p" id="p-m"></div></div>
        <div class="metric err"><div class="k" id="k-u"></div><div class="v" id="v-u"></div><div class="f" id="f-u"></div><div class="p" id="p-u"></div></div>
        <div class="metric err"><div class="k" id="k-b"></div><div class="v" id="v-b"></div><div class="f" id="f-b"></div><div class="p" id="p-b"></div></div>
        <div class="seen"><p><span id="t-seen"></span> <span id="seen"></span></p><button class="reset" id="pin"></button></div>
      </div>
    </div>
  </div>

  <section class="tasks">
    <h3 id="t-tasks"></h3>
    <div id="task-list" class="tasks"></div>
  </section>

  <section class="model">
    <details><summary id="t-model"></summary><div id="model-text"></div></details>
  </section>

  </div>

  <section class="box" data-tab="handout" id="handout-box" hidden></section>

  <nav class="series" id="series"></nav>

  <footer><span id="t-foot"></span> · <a id="t-privacy" href="/privacy.html"></a></footer>
</div>

<script src="../tex.js"></script>
<script src="shadow.js"></script>
<script src="../../topic.js"></script>
</body>
</html>
