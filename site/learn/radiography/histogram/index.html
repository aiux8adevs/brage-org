<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Interactive simulator: the histogram, exposure index (EI and REX), automatic rescaling, LUT and window in digital radiography.">
  <meta name="theme-color" content="#0A0E18">
  <title>From number to image | Oliver Brage</title>
  <link rel="stylesheet" href="histogram.css">
  <link rel="stylesheet" href="../../topic.css">
</head>
<body data-topic="histogram">
<div class="wrap">
  <a class="back" id="t-back" href="../../"></a>
  <header>
    <div>
      <h1 id="t-title">Fra tal til billede</h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div class="toggles">
      <div class="seg" role="group" aria-label="Sprog / language">
        <button id="lang-da" aria-pressed="true">Dansk</button><button id="lang-en" aria-pressed="false">English</button>
      </div>
      <div class="seg" role="group" id="level-group">
        <button id="lvl-grund" aria-pressed="true"></button><button id="lvl-deep" aria-pressed="false"></button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Indhold"></nav>

  <div data-tab="video">
  <section class="video">
    <video id="vid" controls preload="none" playsinline></video>
    <p class="note" id="t-videonote"></p>
  </section>
  </div>

  <div data-tab="simulator" hidden>
  <h2 class="simtitle" id="t-simtitle"></h2>
  <div class="stage">
    <div class="box controls">
      <div id="controls" class="ctls"></div>
      <div id="taskcard" class="taskcard"></div>
    </div>
    <div class="box knee-box">
      <h2 id="t-image"></h2>
      <canvas id="knee"></canvas>
      <p class="note" id="t-synth"></p>
    </div>
    <div class="right">
      <div class="box">
        <h2 id="t-hist"></h2>
        <canvas id="hist"></canvas>
        <p class="note" id="t-histnote"></p>
      </div>
      <div class="box readout">
        <div class="metric mag" id="m-rex"><div class="k" id="k-rex"></div><div class="v" id="v-rex"></div><div class="f" id="f-rex"></div><div class="p" id="p-rex"></div></div>
        <div class="metric" id="m-win"><div class="k" id="k-win"></div><div class="v" id="v-win"></div><div class="f" id="f-win"></div><div class="p" id="p-win"></div></div>
        <div class="seen"><p><span id="t-seen"></span> <span id="seen"></span></p><button class="reset" id="pin"></button></div>
      </div>
    </div>
  </div>


  <section class="tasks">
    <h3 id="t-tasks"></h3>
    <div id="task-list" class="tasks"></div>
  </section>

  <section class="model">
    <details><summary id="t-model"></summary><div id="model-text"></div></details>
  </section>

  </div>

  <section class="box" data-tab="handout" id="handout-box" hidden></section>

  <nav class="series" id="series"></nav>

  <footer><span id="t-foot"></span> · <a id="t-privacy" href="/privacy.html"></a></footer>
</div>

<script src="../tex.js"></script>
<script src="histogram.js"></script>
<script src="../../topic.js"></script>
</body>
</html>
